<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../popup/popup.css" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>Obee Assistant</title>
  </head>
  <body class="panel">
    <header class="bar">
      <span class="brand">Obee Assistant</span>
      <span id="model" class="user"></span>
    </header>

    <main id="thread" class="thread">
      <p class="muted">Loading…</p>
    </main>

    <form id="composer" class="composer" hidden>
      <textarea id="input" rows="2" placeholder="Ask about coffee, markets, sourcing…"></textarea>
      <button id="send" class="primary" type="submit">Send</button>
    </form>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
